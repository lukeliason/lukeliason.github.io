<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luke Eliason — CV</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --orange: #FF4F00; --bg: #faf9f7; }
    body {
      background: var(--bg);
      color: #000;
      font-family: 'Baskerville', 'Baskerville Old Face', 'Libre Baskerville', Georgia, serif;
      font-size: 18px;
      line-height: 1.7;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 0 5rem;
    }
    .banner {
      width: 100%;
      height: 220px;
      overflow: hidden;
      margin-bottom: 3rem;
    }
    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .content { padding: 0 2rem; }
    #site-header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #000;
    }
    #site-header h1 {
      font-size: 1.9rem;
      font-weight: normal;
      letter-spacing: 0.01em;
      margin-bottom: 0.2rem;
    }
    #site-header .subtitle {
      font-size: 1rem;
      font-variant: small-caps;
      letter-spacing: 0.04em;
    }
    #site-header .typeface-note { font-size: 0.8rem; margin-top: 0.3rem; }
    nav { margin-bottom: 3.5rem; }
    nav a {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #000;
      text-decoration: none;
      margin-right: 1.75rem;
    }
    nav a:hover, nav a.active {
      background: var(--orange);
      color: #fff;
      padding: 0 3px;
    }
    section { margin-bottom: 4rem; }
    section h2 {
      font-size: 1rem;
      font-weight: normal;
      font-variant: small-caps;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }
    section p { margin-bottom: 0.9rem; }
    section p:last-child { margin-bottom: 0; }
    a { color: #000; text-decoration: underline; text-underline-offset: 2px; }
    a:hover { background: var(--orange); color: #fff; text-decoration: none; padding: 0 2px; }
    footer {
      position: fixed;
      bottom: 1.25rem;
      left: 1.75rem;
      font-size: 0.75rem;
      color: #999;
    }
    @media (max-width: 480px) {
      .content { padding: 0 1.25rem; }
      .banner { margin-bottom: 2rem; }
    }
  </style>
</head>
<body>
  <div class="banner">
    <img src="banner.jpg" alt="Banner photo" />
  </div>
  <div class="content">
    <header id="site-header">
      <h1><a href="index.html" style="text-decoration:none;color:#000;">Luke Eliason</a></h1>
      <p class="subtitle">researcher in political science</p>
      <p class="typeface-note"><a href="https://en.wikipedia.org/wiki/Baskerville" target="_blank" rel="noopener noreferrer">[About this typeface]</a></p>
    </header>
    <nav>
      <a href="about.html">About</a>
      <a href="cv.html" class="active">CV</a>
      <a href="map.html">Map</a>
    </nav>
    <section id="cv">
      <h2>cv</h2>
      <p>My full curriculum vitae is available as a PDF.</p>
      <p>Contact me at eliasonluke@gmail.com</p>
      <p>
        <a href="cv.pdf" target="_blank" rel="noopener noreferrer">Download CV (PDF)</a>
        &ensp;&middot;&ensp;
        <a href="https://www.linkedin.com/in/lukeeliason" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </p>
    </section>
  </div>
  <footer><p>updated 8-14-26</p></footer>
</body>
</html>
